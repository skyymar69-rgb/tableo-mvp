<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="Illustration : tableau de bord analytique Tabléo avec graphiques de revenus en temps réel">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="760" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000b18"/>
      <stop offset="100%" stop-color="#000f20"/>
    </linearGradient>
    <linearGradient id="a-b1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1560a8"/>
      <stop offset="100%" stop-color="#0fa8cc"/>
    </linearGradient>
    <linearGradient id="a-b2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e7ec8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e7ec8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="a-g" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="a-bar1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1560a8"/>
      <stop offset="100%" stop-color="#0fa8cc"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e7ec8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e7ec8" stop-opacity="0"/>
    </radialGradient>
    <filter id="a-blur20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="a-blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="a-chart"><rect x="30" y="110" width="460" height="200" rx="4"/></clipPath>
  </defs>

  <rect width="760" height="440" fill="url(#a-bg)"/>
  <ellipse cx="380" cy="220" rx="360" ry="220" fill="url(#a-glow)" filter="url(#a-blur20)"/>

  <!-- Subtle grid -->
  <g stroke="#1a3555" stroke-width="0.4" opacity="0.3">
    <line x1="30" y1="110" x2="490" y2="110"/>
    <line x1="30" y1="160" x2="490" y2="160"/>
    <line x1="30" y1="210" x2="490" y2="210"/>
    <line x1="30" y1="260" x2="490" y2="260"/>
    <line x1="30" y1="310" x2="490" y2="310"/>
  </g>

  <!-- Y-axis labels -->
  <text x="20" y="114" fill="rgba(255,255,255,0.28)" font-family="system-ui,sans-serif" font-size="9" text-anchor="end">3k</text>
  <text x="20" y="164" fill="rgba(255,255,255,0.28)" font-family="system-ui,sans-serif" font-size="9" text-anchor="end">2k</text>
  <text x="20" y="214" fill="rgba(255,255,255,0.28)" font-family="system-ui,sans-serif" font-size="9" text-anchor="end">1k</text>
  <text x="20" y="264" fill="rgba(255,255,255,0.28)" font-family="system-ui,sans-serif" font-size="9" text-anchor="end">500</text>
  <text x="20" y="314" fill="rgba(255,255,255,0.28)" font-family="system-ui,sans-serif" font-size="9" text-anchor="end">0</text>

  <!-- Area chart - revenue fill -->
  <g clip-path="url(#a-chart)">
    <path d="M30,280 C80,270 110,240 150,220 C190,200 210,190 250,170 C290,150 310,158 350,145 C390,132 420,120 460,115 L460,310 L30,310 Z"
      fill="url(#a-b2)" opacity="0.7"/>
    <!-- Area chart - growth fill -->
    <path d="M30,295 C80,290 110,280 150,268 C190,255 210,248 250,240 C290,232 310,235 350,228 C390,221 420,215 460,210 L460,310 L30,310 Z"
      fill="url(#a-g)" opacity="0.5"/>
  </g>

  <!-- Revenue line -->
  <path d="M30,280 C80,270 110,240 150,220 C190,200 210,190 250,170 C290,150 310,158 350,145 C390,132 420,120 460,115"
    stroke="#1e7ec8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Growth line -->
  <path d="M30,295 C80,290 110,280 150,268 C190,255 210,248 250,240 C290,232 310,235 350,228 C390,221 420,215 460,210"
    stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5,3"/>

  <!-- Data points on revenue line -->
  <circle cx="150" cy="220" r="4" fill="#1e7ec8" stroke="#000f20" stroke-width="1.5"/>
  <circle cx="250" cy="170" r="4" fill="#1e7ec8" stroke="#000f20" stroke-width="1.5"/>
  <circle cx="350" cy="145" r="4" fill="#1e7ec8" stroke="#000f20" stroke-width="1.5"/>
  <!-- Active tooltip point -->
  <circle cx="460" cy="115" r="6" fill="#0fa8cc" stroke="#000f20" stroke-width="2" filter="url(#a-blur8)"/>
  <circle cx="460" cy="115" r="4" fill="#0fa8cc" stroke="#000f20" stroke-width="1.5"/>
  <!-- Tooltip -->
  <rect x="380" y="78" width="100" height="32" rx="7" fill="#0f1e35" stroke="#1e7ec8" stroke-width="1"/>
  <text x="430" y="91" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui,sans-serif" font-size="7.5">Aujourd'hui</text>
  <text x="430" y="104" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="10.5" font-weight="700">2 847 €</text>

  <!-- X-axis labels -->
  <text x="30" y="326" fill="rgba(255,255,255,0.3)" font-family="system-ui,sans-serif" font-size="8.5">Lun</text>
  <text x="90" y="326" fill="rgba(255,255,255,0.3)" font-family="system-ui,sans-serif" font-size="8.5">Mar</text>
  <text x="150" y="326" fill="rgba(255,255,255,0.3)" font-family="system-ui,sans-serif" font-size="8.5">Mer</text>
  <text x="210" y="326" fill="rgba(255,255,255,0.3)" font-family="system-ui,sans-serif" font-size="8.5">Jeu</text>
  <text x="270" y="326" fill="rgba(255,255,255,0.3)" font-family="system-ui,sans-serif" font-size="8.5">Ven</text>
  <text x="330" y="326" fill="rgba(255,255,255,0.3)" font-family="system-ui,sans-serif" font-size="8.5">Sam</text>
  <text x="390" y="326" fill="rgba(255,255,255,0.3)" font-family="system-ui,sans-serif" font-size="8.5">Dim</text>
  <text x="448" y="326" fill="#1e7ec8" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">Auj.</text>

  <!-- Legend -->
  <line x1="30" y1="345" x2="50" y2="345" stroke="#1e7ec8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="55" y="349" fill="rgba(255,255,255,0.6)" font-family="system-ui,sans-serif" font-size="8.5">Revenus</text>
  <line x1="120" y1="345" x2="140" y2="345" stroke="#4ade80" stroke-width="2" stroke-dasharray="4,2" stroke-linecap="round"/>
  <text x="145" y="349" fill="rgba(255,255,255,0.6)" font-family="system-ui,sans-serif" font-size="8.5">Croissance</text>

  <!-- Chart title -->
  <text x="30" y="90" fill="rgba(255,255,255,0.85)" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Revenus de la semaine</text>
  <rect x="240" y="76" width="90" height="20" rx="5" fill="#0d2818" stroke="#1a6030" stroke-width="0.8"/>
  <text x="285" y="90" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="9" font-weight="600">↑ +18% vs S-1</text>

  <!-- ══ KPI Cards (right column) ══ -->
  <!-- Card 1: Panier moyen -->
  <rect x="510" y="30" width="220" height="82" rx="12" fill="#0c1928" stroke="#1e4878" stroke-width="1"/>
  <rect x="510" y="30" width="220" height="82" rx="12" fill="url(#a-b1)" fill-opacity="0.06"/>
  <text x="526" y="52" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="9">Panier moyen</text>
  <text x="526" y="78" fill="white" font-family="system-ui,sans-serif" font-size="22" font-weight="700">60,6 €</text>
  <rect x="620" y="62" width="96" height="22" rx="6" fill="#0d2818" stroke="#1a6030" stroke-width="0.8"/>
  <text x="668" y="77" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">↑ +12%</text>
  <!-- mini bars -->
  <g fill="url(#a-b1)" fill-opacity="0.55" transform="translate(526,92)">
    <rect x="0" y="-8" width="8" height="8" rx="2"/>
    <rect x="11" y="-13" width="8" height="13" rx="2"/>
    <rect x="22" y="-10" width="8" height="10" rx="2"/>
    <rect x="33" y="-16" width="8" height="16" rx="2"/>
    <rect x="44" y="-14" width="8" height="14" rx="2"/>
    <rect x="55" y="-20" width="8" height="20" rx="2"/>
  </g>

  <!-- Card 2: Commandes -->
  <rect x="510" y="128" width="220" height="82" rx="12" fill="#0c1928" stroke="#1a3555" stroke-width="1"/>
  <text x="526" y="150" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="9">Commandes / jour</text>
  <text x="526" y="176" fill="white" font-family="system-ui,sans-serif" font-size="22" font-weight="700">147</text>
  <rect x="620" y="160" width="96" height="22" rx="6" fill="#0d2818" stroke="#1a6030" stroke-width="0.8"/>
  <text x="668" y="175" text-anchor="middle" fill="#4ade80" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">↑ +24%</text>
  <!-- Spark line -->
  <polyline points="526,198 540,192 554,194 568,185 582,188 596,180 610,176" stroke="#1e7ec8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="610" cy="176" r="3" fill="#1e7ec8"/>

  <!-- Card 3: Scans QR -->
  <rect x="510" y="226" width="220" height="82" rx="12" fill="#0c1928" stroke="#1a3555" stroke-width="1"/>
  <text x="526" y="248" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="9">Scans QR / heure</text>
  <text x="526" y="274" fill="white" font-family="system-ui,sans-serif" font-size="22" font-weight="700">47</text>
  <rect x="620" y="258" width="96" height="22" rx="6" fill="#0d2818" stroke="#1a6030" stroke-width="0.8"/>
  <text x="668" y="273" text-anchor="middle" fill="#4da8e8" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">↑ +18%</text>
  <!-- Radial scan icon -->
  <g transform="translate(526, 296)" stroke="#1e7ec8" fill="none" stroke-linecap="round">
    <path d="M0,-12 Q8,-18 16,-12" stroke-width="1.8"/>
    <path d="M2,-8 Q8,-13 14,-8" stroke-width="1.8"/>
    <path d="M4,-4 Q8,-8 12,-4" stroke-width="1.8"/>
    <circle cx="8" cy="0" r="2.5" fill="#1e7ec8" stroke="none"/>
  </g>
  <text x="544" y="300" fill="rgba(255,255,255,0.38)" font-family="system-ui,sans-serif" font-size="8">Scan instantané · 0,3s</text>

  <!-- Card 4: Tables -->
  <rect x="510" y="324" width="220" height="88" rx="12" fill="#0c1928" stroke="#1a3555" stroke-width="1"/>
  <text x="526" y="345" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="9">Tables actives ce soir</text>
  <g transform="translate(526,352)">
    <rect x="0"   y="0" width="28" height="28" rx="6" fill="url(#a-b1)"/>
    <rect x="33"  y="0" width="28" height="28" rx="6" fill="url(#a-b1)"/>
    <rect x="66"  y="0" width="28" height="28" rx="6" fill="url(#a-b1)"/>
    <rect x="99"  y="0" width="28" height="28" rx="6" fill="url(#a-b1)"/>
    <rect x="132" y="0" width="28" height="28" rx="6" fill="url(#a-b1)" fill-opacity="0.35" stroke="#1e7ec8" stroke-width="0.8"/>
    <rect x="165" y="0" width="28" height="28" rx="6" fill="#0f1928" stroke="#1a3555" stroke-width="0.8"/>
    <text x="14"  y="18" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="9" font-weight="700">T1</text>
    <text x="47"  y="18" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="9" font-weight="700">T2</text>
    <text x="80"  y="18" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="9" font-weight="700">T3</text>
    <text x="113" y="18" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="9" font-weight="700">T4</text>
    <text x="146" y="18" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui,sans-serif" font-size="9" font-weight="600">T5</text>
    <text x="179" y="18" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="system-ui,sans-serif" font-size="9">T6</text>
  </g>
  <text x="526" y="404" fill="rgba(255,255,255,0.35)" font-family="system-ui,sans-serif" font-size="8">4/6 tables occupées · 2 libres</text>

  <!-- Top bar title area -->
  <text x="30" y="42" fill="white" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Dashboard Analytics</text>
  <text x="30" y="58" fill="rgba(255,255,255,0.38)" font-family="system-ui,sans-serif" font-size="9">Le Petit Bistro · Mis à jour il y a 12s</text>
  <circle cx="200" cy="54" r="4" fill="#4ade80"/>
  <circle cx="200" cy="54" r="4" fill="#4ade80" fill-opacity="0.4" filter="url(#a-blur8)"/>
  <text x="208" y="58" fill="#4ade80" font-family="system-ui,sans-serif" font-size="8.5">Live</text>

  <!-- Range selector -->
  <rect x="360" y="28" width="126" height="26" rx="8" fill="#0c1928" stroke="#1a3555" stroke-width="0.8"/>
  <rect x="362" y="30" width="40" height="22" rx="6" fill="url(#a-b1)"/>
  <text x="382" y="45" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">7j</text>
  <text x="412" y="45" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui,sans-serif" font-size="8.5">30j</text>
  <text x="442" y="45" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui,sans-serif" font-size="8.5">90j</text>
</svg>
